<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c5cff">
<title>Leo 的网页小站</title>
<meta name="description" content="Leo 的网页小站：网页小游戏中心与音乐播放器，支持按权限等级分级的浏览器内可视化内容管理。">
<link rel="stylesheet" href="assets/css/leo-ui.css">
</head>
<body class="leo-page">
<nav id="leo-nav" class="leo-nav"></nav>

<main class="leo-wrap">
  <!-- 顶部主视觉（由 site.json / 内置默认 + 本地配置驱动） -->
  <section class="leo-hero" id="hero"></section>

  <!-- 站点公告 -->
  <div id="announce"></div>

  <!-- 板块入口 -->
  <section class="leo-section" id="blocks-sec">
    <header>
      <h2>站点板块 <span class="count" id="blocks-count">—</span></h2>
      <span class="hint" id="site-source"></span>
    </header>
    <div class="leo-grid" id="blocks"></div>
  </section>

  <!-- 精选游戏（读取游戏目录） -->
  <section class="leo-section" id="featured-sec">
    <header>
      <h2>精选游戏 <span class="count" id="featured-count">—</span></h2>
      <a class="leo-btn sm" href="game/">查看全部 →</a>
    </header>
    <div class="leo-grid" id="featured"></div>
  </section>

  <!-- 权限 4 内联编辑器（未登录 / 权限不足时自动隐藏） -->
  <section class="leo-section leo-hidden" id="editor-sec">
    <header>
      <h2>可视化编辑主页 <span class="count">需要权限 4</span></h2>
      <span class="hint">修改先保存在当前浏览器，点「导出 site.json」可提交到仓库让所有访问者生效</span>
    </header>
    <div class="leo-card pad" id="site-editor"></div>
  </section>

  <!-- 拓展板块（可在编辑器里增删） -->
  <div id="sections"></div>

  <footer class="leo-footer" id="footer"></footer>
</main>

<script src="assets/js/leo-auth.js"></script>
<script src="assets/js/leo-site.js"></script>
<script src="assets/js/leo-catalog.js"></script>
<script src="assets/js/leo-ui.js"></script>
<script>
/*!
 * 主页逻辑：渲染 site.json 配置（hero / 公告 / 板块 / 拓展板块 / 页脚）、
 * 精选游戏，并在权限 4 时挂载 LEOSite.mountEditor 做可视化编辑。
 */
(function () {
  'use strict';
  var A = window.LEOAuth, S = window.LEOSite, C = window.LEOCatalog, U = window.LEOUI;
  if (!A || !U) { try { console.error('[home] 需要先加载 leo-auth.js 与 leo-ui.js'); } catch (e) { /* ignore */ } return; }

  var esc = U.esc;
  var $ = function (sel) { return document.querySelector(sel); };
  var editorMounted = false;
  var FALLBACK = { brand: {}, hero: {}, blocks: [], sections: [], footer: { links: [] } };

  /* ======================== 通用渲染工具 ======================== */
  function hrefFor(href) { return U.abs(href || './'); }
  function coverUrl(g) {
    var c = String((g && g.cover) || '').trim();
    if (!c) return '';
    if (/^[a-z][a-z0-9+.-]*:/i.test(c) || c.charAt(0) === '/') return c;
    var base = (C && C.folderUrl) ? C.folderUrl(g.folder) : hrefFor('game/' + g.folder + '/');
    return base + c.replace(/^\.?\//, '');
  }
  function initial(g) {
    var n = String((g && g.name) || '?').trim();
    return (n.charAt(0) || '?').toUpperCase();
  }
  function gameCard(g) {
    var url = (C && C.gameUrl) ? C.gameUrl(g) : hrefFor('game/' + g.folder + '/');
    var cover = coverUrl(g);
    return '<article class="leo-game">' +
      '<a class="cover" href="' + esc(url) + '">' +
        (cover
          ? '<img src="' + esc(cover) + '" alt="' + esc(g.name) + ' 封面" loading="lazy">'
          : '<span class="fallback">' + esc(initial(g)) + '</span>') +
        (g.featured ? '<span class="flag">精选</span>' : '') +
      '</a>' +
      '<div class="body">' +
        '<div class="ttl">' + esc(g.name) + (g.hidden ? ' <span class="leo-perm p0">已隐藏</span>' : '') + '</div>' +
        '<div class="desc">' + esc(g.desc || '暂无简介，可在管理中心的「游戏目录」里补充。') + '</div>' +
        (g.tags && g.tags.length
          ? '<div class="tags">' + g.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
          : '') +
        '<div class="actions"><a class="leo-btn sm primary" href="' + esc(url) + '">开始游戏</a>' +
        '<span class="path">game/' + esc(g.folder) + '/</span></div>' +
      '</div></article>';
  }
  function actBtn(text, href, cap, cls) {
    if (!text) return '';
    var allowed = A.can(cap);
    return '<button class="leo-btn ' + (cls || '') + '" type="button" data-goto="' + esc(href || '') +
      '" data-cap="' + esc(cap) + '">' + (allowed ? '' : '🔒 ') + esc(text) + '</button>';
  }

  /* ======================== 各区块渲染 ======================== */
  function renderHero(cfg) {
    var h = cfg.hero || {};
    $('#hero').innerHTML =
      (h.tagline ? '<span class="tagline">✦ ' + esc(h.tagline) + '</span>' : '') +
      '<h1>' + esc(h.title || '欢迎') + '</h1>' +
      '<p>' + esc(h.subtitle || '') + '</p>' +
      '<div class="actions">' +
        actBtn(h.primaryText, h.primaryHref, 'viewGames', 'primary') +
        actBtn(h.secondaryText, h.secondaryHref, 'useMusic') +
      '</div>';
  }

  function renderAnnounce(cfg) {
    var a = cfg.announcement || {};
    var box = $('#announce');
    if (!a.enabled || !a.text) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="leo-card pad" style="margin-top:16px">' +
      '<div class="leo-kv"><b>📢 ' + esc(a.title || '站点公告') + '</b></div>' +
      '<p style="margin:9px 0 0;color:var(--muted);font-size:13.5px;line-height:1.9">' + esc(a.text) + '</p></div>';
  }

  function renderBlocks(cfg) {
    var blocks = (cfg.blocks || []).filter(function (b) { return b.enabled !== false; });
    var stats = (C && C.stats) ? C.stats() : { visible: 0 };
    $('#blocks').innerHTML = blocks.map(function (b) {
      var cap = b.cap || 'viewHome';
      var allowed = A.can(cap);
      var extra = (b.kind === 'games')
        ? '<span class="leo-muted leo-nowrap" style="font-size:11.5px">' + stats.visible + ' 个游戏</span>' : '';
      var inner = '<span class="ico">' + esc(b.icon || '📄') + '</span>' +
        '<div class="ttl">' + esc(b.title || '未命名板块') + extra + '</div>' +
        '<div class="desc">' + esc(b.desc || '') + '</div>' +
        '<div class="foot">' + (b.kind === 'note' ? '说明板块' : (allowed ? '点击进入 →' : '需要更高权限')) + '</div>' +
        (allowed || b.kind === 'note' ? '' : '<span class="lock">🔒</span>');
      if (b.kind === 'note' || !b.href) return '<div class="leo-tile dim">' + inner + '</div>';
      return '<a class="leo-tile' + (allowed ? '' : ' dim locked') + '" href="' + esc(hrefFor(b.href)) +
        '" data-cap="' + esc(cap) + '">' + inner + '</a>';
    }).join('') || '<p class="leo-empty">暂无启用的板块，可在权限 4 的编辑器里新增。</p>';
    $('#blocks-count').textContent = blocks.length + ' 个';
    $('#site-source').textContent = (S && S.sourceLabel) ? ('内容来源：' + S.sourceLabel()) : '';
  }

  function renderFeatured() {
    var box = $('#featured');
    if (!C) { $('#featured-sec').classList.add('leo-hidden'); return; }
    var list = C.list({ sort: 'order', featuredFirst: true }).slice(0, 4);
    if (!list.length) {
      box.innerHTML = '<p class="leo-empty">游戏目录还是空的：把游戏放进 <code>game/新的文件夹/index.html</code>，' +
        '再到「游戏中心」点一次「扫描 game/ 目录」即可收录。</p>';
      $('#featured-count').textContent = '0 个';
      return;
    }
    box.innerHTML = list.map(gameCard).join('');
    var st = C.stats();
    $('#featured-count').textContent = st.visible + ' / ' + st.total + ' 个';
  }

  function renderSections(cfg) {
    $('#sections').innerHTML = (cfg.sections || []).filter(function (s) { return s.enabled !== false; }).map(function (s) {
      return '<section class="leo-section"><header><h2>' + esc(s.title || '说明') + '</h2></header>' +
        '<div class="leo-card pad"><p style="margin:0;color:var(--muted);font-size:13.5px;line-height:1.9">' +
        esc(s.text || '') + '</p></div></section>';
    }).join('');
  }

  function renderFooter(cfg) {
    var f = cfg.footer || {};
    var links = (f.links || []).map(function (l) {
      return '<a href="' + esc(hrefFor(l.href)) + '">' + esc(l.label || l.href) + '</a>';
    }).join('');
    $('#footer').innerHTML = '<div>' + esc(f.text || '') + '</div><div class="links">' + links + '</div>';
  }

  function renderEditor() {
    var sec = $('#editor-sec');
    if (!A.can('editSite')) { sec.classList.add('leo-hidden'); return; }
    sec.classList.remove('leo-hidden');
    if (!editorMounted && S && S.mountEditor) {
      editorMounted = true;
      S.mountEditor('#site-editor', { onSave: function () { renderAll(); } });
    }
  }

  /* ======================== 总渲染 + 交互 ======================== */
  function renderAll() {
    var cfg = (S && S.get) ? S.get() : FALLBACK;
    var brand = cfg.brand || {};
    document.title = (brand.name || 'Leo 的网页小站') + ' · 主页';
    renderHero(cfg);
    renderAnnounce(cfg);
    renderBlocks(cfg);
    renderFeatured();
    renderSections(cfg);
    renderFooter(cfg);
    renderEditor();
  }

  /* hero / 板块里的按钮与卡片：权限不足时给出提示并引导登录 */
  function onGatedClick(ev) {
    var hit = ev.target.closest('[data-cap]');
    if (!hit) return;
    var cap = hit.getAttribute('data-cap');
    if (A.can(cap)) return;
    ev.preventDefault();
    U.guard(cap);
  }
  document.querySelector('main').addEventListener('click', onGatedClick);
  $('#hero').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-goto]');
    if (!btn) return;
    var cap = btn.getAttribute('data-cap');
    if (!A.can(cap)) { U.guard(cap); return; }
    location.href = hrefFor(btn.getAttribute('data-goto'));
  });

  /* ======================== 启动 ======================== */
  U.mountNav({ host: '#leo-nav', onAuth: function () { renderAll(); } });
  A.on(renderAll);
  if (S && S.on) S.on(renderAll);
  if (C && C.on) C.on(renderAll);
  renderAll();

  A.ready.then(function () {
    return Promise.all([S && S.load ? S.load() : null, C && C.load ? C.load() : null]);
  }).then(function () {
    renderAll();
  }).catch(function (err) {
    try { console.error('[home] 初始化失败', err); } catch (e) { /* ignore */ }
  });
})();
</script>
</body>
</html>
