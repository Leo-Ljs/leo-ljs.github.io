<!--
  新页面模板
  ------------------------------------------------------------
  1. 复制本文件到目标目录，例如 `notes/index.html`。
  2. 把 {{TITLE}}、{{DESCRIPTION}}、{{PAGE_TITLE}}、{{PAGE_INTRO}}
     和 {{CONTENT}} 替换成真实内容。
  3. 需要额外样式时，在 {{EXTRA_CSS}} 处加入 <link>，
     或把样式写进 assets/css/site.css 的对应区块。
  4. 站内链接统一使用以 / 开头的根路径，例如 /pan/、/notes/。
  5. 新目录页面建好后，可把入口加到首页的“三个小角落”和导航中。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Leo 的小站</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#f3faf7">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/css/site.css">
  {{EXTRA_CSS}}
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14"/>
      <path d="m13 6 6 6-6 6"/>
    </symbol>
    <symbol id="i-github" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="none" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.35 4.68-4.58 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/>
    </symbol>
  </svg>

  <header class="site-header" data-site-header>
    <div class="wrap nav-inner">
      <a class="brand" href="/" aria-label="Leo 的小站，回到首页">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span class="brand-text">Leo 的小站</span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="打开菜单">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/pan/">网盘</a>
        <a href="/tools/local-editor.html">本地工具</a>
        <a class="nav-github" href="https://github.com/Leo-Ljs" target="_blank" rel="noopener noreferrer">
          <svg class="icon" aria-hidden="true"><use href="#i-github"></use></svg>
          GitHub
        </a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="wrap section" aria-labelledby="page-title">
      <p class="eyebrow">{{EXTRA_LABEL}}</p>
      <h1 class="section-title" id="page-title">{{PAGE_TITLE}}</h1>
      <p class="section-lead">{{PAGE_INTRO}}</p>
      <div class="page-content">
        {{CONTENT}}
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-brand">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span class="brand-text">Leo 的小站</span>
        </a>
        <p>一个慢慢长大的个人角落。</p>
      </div>
      <nav class="footer-links" aria-label="页脚导航">
        <a href="/">首页</a>
        <a href="/pan/">网盘</a>
        <a href="/tools/local-editor.html">本地工具</a>
        <a href="https://github.com/Leo-Ljs/leo-ljs.github.io" target="_blank" rel="noopener noreferrer">源码</a>
      </nav>
      <div class="footer-note">
        <span>© <span data-year>2026</span> Leo · 用 HTML / CSS / JS 手写</span>
      </div>
    </div>
  </footer>

  <div class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <script src="/assets/js/site.js"></script>
</body>
</html>
