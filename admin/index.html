<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<title>管理中心 · Leo 的网页小站</title>
<meta name="description" content="站点管理中心：查看站点状态，直观地编辑站点内容与游戏目录。">
<link rel="stylesheet" href="../assets/css/leo-ui.css">
</head>
<body class="leo-page">
<nav id="leo-nav" class="leo-nav"></nav>

<main class="leo-wrap">
  <section class="leo-section" style="margin-top:0">
    <header>
      <h2>管理中心 <span class="count" id="who">—</span></h2>
      <span class="hint">站点内容与游戏目录都可以在这里直接编辑；改动先保存在当前浏览器</span>
    </header>
  </section>

  <div class="leo-tabs" id="tabs">
    <button class="leo-tab active" type="button" data-tab="overview">概览</button>
    <button class="leo-tab" type="button" data-tab="site">站点内容</button>
    <button class="leo-tab" type="button" data-tab="catalog">游戏目录</button>
  </div>

  <section class="leo-card pad" data-pane="overview"></section>
  <section class="leo-card pad leo-hidden" data-pane="site"></section>
  <section class="leo-card pad leo-hidden" data-pane="catalog"></section>

  <footer class="leo-footer" id="footer"></footer>
</main>

<script src="../assets/js/leo-site.js"></script>
<script src="../assets/js/leo-catalog.js"></script>
<script src="../assets/js/leo-ui.js"></script>
<script>
/*!
 * 管理中心逻辑：概览 / 站点内容 / 游戏目录。
 * 站点没有账户与权限系统，这三个页面对所有访问者都开放；
 * 所有修改先保存在当前浏览器，导出 JSON 并提交到仓库后才会对其他访问者生效。
 */
(function () {
  'use strict';
  var S = window.LEOSite, C = window.LEOCatalog, U = window.LEOUI;
  if (!U) { try { console.error('[admin] 需要先加载 leo-ui.js'); } catch (e) { /* ignore */ } return; }

  var esc = U.esc;
  var $ = function (sel) { return document.querySelector(sel); };
  var pane = function (name) { return document.querySelector('[data-pane="' + name + '"]'); };
  var TABS = ['overview', 'site', 'catalog'];
  var active = 'overview';
  var mounted = { site: false, catalog: false };

  function statTile(icon, title, value, extra) {
    return '<div class="leo-tile"><span class="ico">' + esc(icon) + '</span>' +
      '<div class="ttl">' + esc(title) + '</div>' +
      '<div class="desc"><b>' + value + '</b>' + (extra ? '<br>' + extra : '') + '</div></div>';
  }

  /* ======================== 概览 ======================== */
  function renderOverview() {
    var gstat = C ? C.stats() : null;
    var last = C ? C.getLastScan() : null;
    var cfg = (S && S.get) ? S.get() : null;
    var navCount = (cfg && cfg.nav) ? cfg.nav.length : 0;
    var blockCount = (cfg && cfg.blocks) ? cfg.blocks.filter(function (b) { return b.enabled !== false; }).length : 0;
    var host = pane('overview');
    host.innerHTML =
      '<div class="leo-grid">' +
        statTile('游', '游戏总数', gstat ? (gstat.total + ' 个') : '—',
          gstat ? ('可见 ' + gstat.visible + ' · 隐藏 ' + gstat.hidden + ' · 精选 ' + gstat.featured) : '目录模块未加载') +
        statTile('站', '主页板块', blockCount + ' 个',
          '导航项 ' + navCount + ' 个 · 内容来源 ' + esc(S ? S.sourceLabel() : '—')) +
        statTile('录', '游戏目录来源', esc(C ? C.sourceLabel() : '未加载'),
          '仓库文件：' + esc(C ? C.FILE : 'game/games.json')) +
        statTile('扫', '最近一次扫描', last ? (last.changed ? '发现更新' : '无变化') : '尚未扫描',
          last ? (esc(U.fmtTime(last.at)) + ' · ' + esc(C.scanSummary(last))) : '在「游戏目录」标签里可扫描 game/ 目录') +
      '</div>' +
      toolbarHtml() +
      noteHtml();
  }

  /* ======================== 概览：快捷操作 / 说明 ======================== */
  function toolbarHtml() {
    return '<div class="leo-divider"></div>' +
      '<div class="leo-edit-item"><div class="head"><span class="name">快捷操作</span></div>' +
      '<div class="ops">' +
        '<a class="leo-btn sm" href="' + esc(U.abs('./')) + '">主页</a>' +
        '<a class="leo-btn sm" href="' + esc(U.abs('game/')) + '">游戏中心</a>' +
        '<a class="leo-btn sm" href="' + esc(U.abs('music/')) + '">音乐播放器</a>' +
        '<button class="leo-btn sm" type="button" data-scan>扫描 game/ 目录</button>' +
        '<button class="leo-btn sm" type="button" data-reload>重新读取仓库 JSON</button>' +
        '<button class="leo-btn sm" type="button" data-go-tab="site">编辑站点内容</button>' +
        '<button class="leo-btn sm" type="button" data-go-tab="catalog">编辑游戏目录</button>' +
      '</div><div class="leo-msg" data-ov-msg></div></div>';
  }

  function noteHtml() {
    return '<div class="leo-edit-item"><div class="head"><span class="name">纯静态站点说明</span></div>' +
      '<p class="leo-muted" style="font-size:12.5px;line-height:1.9;margin:0">' +
      '本站没有后端：所有内容都写在仓库的 JSON 文件里（<code>assets/data/site.json</code>、<code>game/games.json</code>）。' +
      '编辑器里的改动先保存在<b>当前浏览器</b>（localStorage），点「导出」下载对应的 JSON 并提交到仓库后，' +
      '所有访问者才会看到这些改动。</p></div>';
  }

  function setOvMsg(text, type) {
    var p = pane('overview');
    var m = p ? p.querySelector('[data-ov-msg]') : null;
    if (!m) return;
    m.className = 'leo-msg ' + (type || 'info') + (text ? ' show' : '');
    m.textContent = text || '';
  }

  /* ======================== 站点内容 ======================== */
  function renderSite() {
    var node = pane('site');
    if (!S || !S.mountEditor) {
      node.innerHTML = '<p class="leo-empty">站点配置模块（leo-site.js）未加载。</p>';
      return;
    }
    if (mounted.site) return;
    node.innerHTML = '';
    mounted.site = true;
    S.mountEditor(node, { onSave: function () { renderOverview(); renderChrome(); } });
  }

  /* ======================== 游戏目录 ======================== */
  function renderCatalog() {
    var node = pane('catalog');
    if (!C || !C.mountEditor) {
      node.innerHTML = '<p class="leo-empty">游戏目录模块（leo-catalog.js）未加载。</p>';
      return;
    }
    if (mounted.catalog) return;
    node.innerHTML = '';
    mounted.catalog = true;
    C.mountEditor(node, { onChange: function () { renderChrome(); } });
  }

  /* ======================== 标签页 ======================== */
  function renderPane(name) {
    if (name === 'overview') { renderOverview(); return; }
    if (name === 'site') { renderSite(); return; }
    if (name === 'catalog') { renderCatalog(); }
  }

  function showTab(name, opts) {
    if (TABS.indexOf(name) < 0) name = 'overview';
    active = name;
    var tabs = document.querySelectorAll('.leo-tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === name);
    }
    TABS.forEach(function (t) {
      var p = pane(t);
      if (p) p.classList.toggle('leo-hidden', t !== name);
    });
    renderPane(name);
    if (!opts || opts.hash !== false) {
      try {
        if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
      } catch (e) { /* ignore */ }
    }
  }

  /* ======================== 顶栏 / 页脚 ======================== */
  function renderChrome() {
    var who = $('#who');
    if (who) who.textContent = S ? S.sourceLabel() : '—';
    var foot = $('#footer');
    if (foot) {
      foot.innerHTML = '<p>Leo 的网页小站 · 管理中心<br>' +
        '站点内容：' + esc(S ? S.sourceLabel() : '站点模块未加载') +
        ' · 游戏目录：' + esc(C ? C.sourceLabel() : '目录模块未加载') + '</p>';
    }
  }

  /* ======================== 数据读取 / 扫描 ======================== */
  function readRepo() {
    var jobs = [];
    if (S && S.load) jobs.push(S.load());
    if (C && C.load) jobs.push(C.load());
    return Promise.all(jobs)['catch'](function () { return null; });
  }

  function reloadData(fromToolbar) {
    mounted.site = false;
    mounted.catalog = false;
    return readRepo().then(function () {
      renderOverview();
      renderChrome();
      if (active !== 'overview') renderPane(active);
      if (fromToolbar) U.toast('已重新读取仓库 JSON', 'ok');
    });
  }

  function runScan() {
    if (!C || !C.scan) return;
    setOvMsg('正在扫描 game/ 目录，请稍候…', 'info');
    var node = pane('catalog');
    var bar = node ? node.querySelector('.leo-editor-bar .title') : null;
    if (bar) bar.textContent = '正在扫描 game/ 目录…';
    C.scan({ refresh: false }).then(function (res) {
      var text = C.scanSummary(res);
      /* 先重绘面板，再写提示，避免提示被重绘清空 */
      mounted.catalog = false;
      renderOverview();
      renderChrome();
      if (active === 'catalog') renderPane('catalog');
      else setOvMsg('扫描完成 · ' + text, res.changed ? 'ok' : 'info');
      U.toast(res.changed ? '扫描完成：发现更新' : '扫描完成：无变化', 'ok');
    })['catch'](function (e) {
      setOvMsg('扫描失败：' + e, 'err');
      U.toast('扫描失败：' + e, 'err');
    });
  }

  /* ======================== 事件绑定 / 启动 ======================== */
  function initHash() {
    var h = (location.hash || '').replace('#', '');
    return (h && TABS.indexOf(h) >= 0) ? h : 'overview';
  }

  function wireEvents() {
    var tabs = $('#tabs');
    if (tabs) tabs.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-tab]');
      if (b) showTab(b.getAttribute('data-tab'));
    });
    var ov = pane('overview');
    if (ov) ov.addEventListener('click', function (ev) {
      var go = ev.target.closest('[data-go-tab]');
      if (go) { showTab(go.getAttribute('data-go-tab')); return; }
      if (ev.target.closest('[data-reload]')) { reloadData(true); return; }
      if (ev.target.closest('[data-scan]')) runScan();
    });
    window.addEventListener('hashchange', function () {
      var h = (location.hash || '').replace('#', '');
      if (h && TABS.indexOf(h) >= 0 && h !== active) showTab(h, { hash: false });
    });
  }

  wireEvents();
  U.mountNav({ host: '#leo-nav' });
  if (S && S.on) S.on(renderChrome);
  if (C && C.on) C.on(renderChrome);
  renderChrome();

  readRepo().then(function () {
    active = initHash();
    showTab(active, { hash: false });
  })['catch'](function (e) {
    try { console.error('[admin] 初始化失败', e); } catch (err) { /* ignore */ }
    showTab('overview', { hash: false });
  });
})();
</script>
</body>
</html>
